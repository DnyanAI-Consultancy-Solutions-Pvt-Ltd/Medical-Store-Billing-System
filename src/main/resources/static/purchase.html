<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Purchase Entry</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    margin:0;
}

.navbar{
    background:#2c3e50;
    color:white;
    padding:15px;
    font-size:22px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 2px 5px gray;
}

input,select{
    padding:10px;
    margin:5px;
}

button{
    padding:10px 15px;
    cursor:pointer;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#3498db;
    color:white;
}

.total-box{
    text-align:right;
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}


</style>

</head>

<body>

<div class="navbar">
Purchase Entry
</div>

<div class="container">

<div class="card">

<h3>Purchase Information</h3>
<b><label>Invoice No:</label></b>
<input
type="text"
id="invoiceNo"
placeholder="Invoice No">
<b><label>Purchase Date :</label></b>
<input
type="date"
id="purchaseDate">
<b><label>Batch No:</label></b>
<input
type="number"
id="batchNo">

<b><label>Supplier/ WholeSaler:</label></b>
<select id="supplierSelect">
</select>

</div>

<br>

<div class="card">

<h3>Add Medicine</h3>

<select id="medicineSelect">
</select>
<b><label>Quantity:</label></b>

<input
type="number"
id="qty"
placeholder="Qty">
<b><label>Purchase Price:</label></b>

<input
type="number"
id="purchaseRate"
placeholder="Purchase Rate">
<b><label>MRP :</label></b>

<input
type="number"
id="mrp"
placeholder="MRP">

<b><label>Expiry Date :</label></b>
<input
type="date"
id="expiryDate">
<b><label>GST :</label></b>
<input
type="number"
id="gst">
<button onclick="addItem()">

Add Item
</button>

</div>

<div class="card" style="margin-top:20px;">

<h3>Purchase Items</h3>

<table>

<thead>
<tr>
<th>Invoice No</th>
<th>Medicine</th>
<th>Batch No</th>
<th>Purchase Date</th>
<th>Supplier Name</th>
<th>Qty</th>
<th>Purchase Rate</th>
<th>MRP</th>
<th>Expiry Date</th>
<th>Gst</th>
<th>Amount</th>
<th></th>
</tr>
</thead>

<tbody id="purchaseTable">
</tbody>

</table>

<div class="total-box">

Total : ₹ <span id="totalAmount">0</span>

</div>

<br>

<button onclick="savePurchase()">
Save Purchase
</button>

</div>

</div>

<script>

let purchaseItems = [];

loadSuppliers();
loadMedicines();

function loadSuppliers(){

fetch("/api/suppliers")
.then(res=>res.json())
.then(data=>{

let options="";

data.forEach(s=>{

options +=
`<option value="${s.id}">
${s.supplierName}
</option>`;

});

document.getElementById("supplierSelect")
.innerHTML=options;

});

}

function loadMedicines(){

fetch("/api/medicines")
.then(res=>res.json())
.then(data=>{

let options="";

data.forEach(m=>{

options +=
`<option value="${m.id}">
${m.medicineName}
</option>`;

});

document.getElementById("medicineSelect")
.innerHTML=options;

});

}

function addItem(){

let medicineId =
document.getElementById("medicineSelect").value;
let invoiceNo =
	document.getElementById("invoiceNo").value;

let medicineName =
document.getElementById("medicineSelect")
.options[
document.getElementById("medicineSelect").selectedIndex
].text;
let batchNo =
	document.getElementById("batchNo").value;
let purchaseDate =
	document.getElementById("purchaseDate").value;
let supplierName =
	document.getElementById("supplierSelect")
	.options[
	document.getElementById("supplierSelect").selectedIndex
	].text;
let qty =
parseInt(document.getElementById("qty").value);

let purchaseRate =
parseFloat(document.getElementById("purchaseRate").value);
let mrp =
	parseInt(document.getElementById("mrp").value);
let expiryDate =
	document.getElementById("expiryDate").value;
let gst =
	parseInt(document.getElementById("gst").value);
let amount = qty * purchaseRate;

purchaseItems.push({
	invoiceNo:invoiceNo,
medicineId:medicineId,
medicineName:medicineName,
batchNo:batchNo,
purchaseDate:purchaseDate,
suppplierName:suppplierName,
quantity:qty,
purchaseRate:purchaseRate,
mrp:mrp,
expiryDate:expiryDate,
gst:gst,
amount:amount,


});

renderTable();

}

function renderTable(){

let rows="";

let total=0;

purchaseItems.forEach((item,index)=>{

total += item.amount;

rows += `
<tr>
	<td>${item.invoiceNo}</td>
<td>${item.medicineName}</td>
<td>${item.batchNo}</td>
<td>${item.purchaseDate}</td>
<td>${item.supplierName}</td>

<td>${item.quantity}</td>

<td>${item.purchaseRate}</td>
<td>${item.mrp}</td>
<td>${item.expiryDate}</td>
<td>${item.gst}</td>

<td>${item.amount}</td>

<td>

<button onclick="removeItem(${index})">
Delete
</button>

</td>

</tr>
`;

});

document.getElementById("purchaseTable")
.innerHTML = rows;

document.getElementById("totalAmount")
.innerText = total;

}

function removeItem(index){

purchaseItems.splice(index,1);

renderTable();

}

function savePurchase(){

let request = {

supplierId:
document.getElementById("supplierSelect").value,

invoiceNo:
document.getElementById("invoiceNo").value,

items: purchaseItems

};

fetch("/api/purchases",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(request)

})
.then(res=>res.json())
.then(data=>{

alert("Purchase Saved");

purchaseItems=[];

renderTable();

});

}

</script>

</body>
</html>
