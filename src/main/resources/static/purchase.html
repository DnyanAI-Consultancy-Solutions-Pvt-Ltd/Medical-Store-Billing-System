<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Purchase Entry</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    margin:0;
}

.navbar{
    background:#2c3e50;
    color:white;
    padding:15px;
    font-size:22px;
}
.header{
background:#198754;
color:white;
padding:20px;
font-size:28px;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.2);
    display:flex;
    justify-content:center;
    align-items:center;
     position:relative;
}
.logo{
 position:absolute;
   left:20px;
 height:60px;
    width:170px;
    border-radius: 15px;  
    margin-left:10px;
    
}
.header span{
    margin:0 auto;
}
.container{
    width:98%;
    margin:auto;
}

.card{
    background:#fff;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card h3{
    margin-bottom:15px;
    color:#0f4c81;
}

.form-grid{

    display:grid;

    grid-template-columns:180px 250px 180px 250px;

    gap:12px 20px;

    align-items:center;

}

.form-grid label{

    font-weight:bold;

    text-align:right;

    padding-right:10px;

    white-space:nowrap;

}

.form-grid input,
.form-grid select{

    width:100%;

    height:38px;

    padding:6px 10px;

    border:1px solid #ccc;

    border-radius:5px;

}

.btn{

    width:180px;

    height:40px;

    background:#198754;

    color:white;

    border:none;

    border-radius:6px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

}

.btn:hover{

    background:#146c43;

}

input,select{
    padding:10px;
    margin:5px;
}

button{
    padding:10px 15px;
    cursor:pointer;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#3498db;
    color:white;
}

.total-box{
    text-align:right;
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.close-btn{

    position:absolute;

    right:20px;

    top:50%;

    transform:translateY(-50%);

    background:#dc3545;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:6px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

}

.close-btn:hover{

    background:#bb2d3b;

}
#medicineDropdown div{
    padding:10px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

#medicineDropdown div:hover,
#medicineDropdown div.active{
    background:#2196f3;
    color:white;
}
/* =====================================================
   CUSTOM DROPDOWN
===================================================== */

.custom-select-wrapper{
    position:relative;
    width:100%;
}


/* Supplier / GST input */

.custom-select-wrapper > input{
    width:100%;
    height:38px;
    box-sizing:border-box;
    padding:8px 10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
    background:white;
    cursor:pointer;
}


.custom-select-wrapper > input:focus{
    outline:none;
    border-color:#2196f3;
    box-shadow:0 0 4px rgba(33,150,243,.35);
}


/* =====================================================
   DROPDOWN BOX
===================================================== */

.custom-dropdown{

    display:none;

    position:absolute;

    top:43px;
    left:0;

    width:100%;

    max-height:220px;

    overflow-y:auto;

    background:#fff;

    border:1px solid #ccc;

    border-radius:6px;

    box-shadow:0 4px 10px rgba(0,0,0,.18);

    z-index:99999;

}


/* =====================================================
   DROPDOWN OPTION
===================================================== */

.custom-dropdown div{

    padding:10px 12px;

    min-height:38px;

    box-sizing:border-box;

    display:flex;

    align-items:center;

    cursor:pointer;

    font-size:14px;

    color:#333;

    background:white;

    transition:background .1s ease;

}


/* Mouse hover */

.custom-dropdown div:hover{

    background:#2196f3;

    color:white;

}


/* Keyboard selected option */

.custom-dropdown div.active{

    background:#2196f3 !important;

    color:white !important;

}


/* =====================================================
   SCROLLBAR
===================================================== */

.custom-dropdown::-webkit-scrollbar{

    width:7px;

}

.custom-dropdown::-webkit-scrollbar-track{

    background:#f1f1f1;

}

.custom-dropdown::-webkit-scrollbar-thumb{

    background:#aaa;

    border-radius:10px;

}

.custom-dropdown::-webkit-scrollbar-thumb:hover{

    background:#777;

}


/* =====================================================
   MEDICINE DROPDOWN
===================================================== */

#medicineDropdown{

    display:none;

    position:absolute;

    top:43px;

    left:0;

    width:100%;

    max-height:220px;

    overflow-y:auto;

    background:white;

    border:1px solid #ccc;

    border-radius:6px;

    box-shadow:0 4px 10px rgba(0,0,0,.18);

    z-index:99999;

}


/* Medicine options */

#medicineDropdown div{

    padding:10px 12px;

    min-height:38px;

    box-sizing:border-box;

    display:flex;

    align-items:center;

    cursor:pointer;

    font-size:14px;

    color:#333;

    background:white;

}


/* Medicine mouse hover */

#medicineDropdown div:hover{

    background:#2196f3;

    color:white;

}


/* Medicine keyboard selection */

#medicineDropdown div.active{

    background:#2196f3 !important;

    color:white !important;

}


/* Medicine scrollbar */

#medicineDropdown::-webkit-scrollbar{

    width:7px;

}

#medicineDropdown::-webkit-scrollbar-track{

    background:#f1f1f1;

}

#medicineDropdown::-webkit-scrollbar-thumb{

    background:#aaa;

    border-radius:10px;

}


/* =====================================================
   FORM INPUT CONSISTENCY
===================================================== */

.form-grid input{

    height:38px;

    box-sizing:border-box;

    padding:8px 10px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:14px;

}


.form-grid input:focus{

    outline:none;

    border-color:#2196f3;

    box-shadow:0 0 4px rgba(33,150,243,.35);

}


/* Medicine search */

#medicineSearch{

    width:100% !important;

    height:38px !important;

    box-sizing:border-box;

}


/* =====================================================
   LABEL
===================================================== */

.form-grid label{

    font-size:14px;

    font-weight:600;

    color:#444;

}


/* =====================================================
   BUTTON
===================================================== */

.btn{

    background:#198754;

    color:white;

    border:none;

    padding:10px 25px;

    border-radius:6px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

}


.btn:hover{

    background:#146c43;

}
</style>

</head>

<body>

<div class="header">
<img src="/images/logo.jpeg" class="logo">
<span>Purchase Entry</span>
 <button class="close-btn" onclick="closePage()">
        ✖ Close
    </button>
</div>

<div class="container">

    <div class="card">

        <h3>Purchase Information</h3>

            <label>Invoice No :</label>

<div class="custom-select-wrapper">

    <input type="hidden" id="supplierId">

</div>
        </div>

    </div>

    <div class="card">

        <h3>Add Medicine</h3>

        <div class="form-grid">

           <label>Medicine :</label>

<div style="position:relative; width:100%;">

    <input
        type="text"
        id="medicineSearch"
        placeholder="Search Medicine"
        autocomplete="off"
        style="width:100%; height:38px; padding:6px 10px; border:1px solid #ccc; border-radius:5px;"
    >

    <input type="hidden" id="medicineSelect">

         style="
            display:none;
            position:absolute;
            top:43px;
            left:0;

            max-height:220px;
            overflow-y:auto;

            border:1px solid #ccc;
            border-radius:5px;
            box-shadow:0 2px 8px rgba(0,0,0,.2);
            z-index:9999;
         ">
    </div>

</div>
            <label>Quantity :</label>
            <input type="number" id="qty" placeholder="Qty">

            <label>Purchase Price :</label>
            <input type="number" id="purchaseRate" placeholder="Purchase Rate">

            <label>MRP :</label>
            <input type="number" id="mrp" placeholder="MRP">

            <label>Expiry Date :</label>
            <input type="date" id="expiryDate">
<label>Gst % :</label>

    <input
        type="text"
        id="gst"
        value="0"
        placeholder="Select GST"
        autocomplete="off"
        readonly
    >

    <div id="gstDropdown" class="custom-dropdown">

        <div data-value="0">0%</div>
        <div data-value="5">5%</div>

    </div>

</div>
        </div>

        <br>

        <button id="addItemBtn" class="btn" onclick="addItem()">
            Add Item
        </button>

    </div>

</div>
<div class="card" style="margin-top:20px;">

<h3>Purchase Items</h3>

<table>

<thead>
<tr>
<th>Invoice No</th>
<th>Medicine</th>
<th>Batch No</th>
<th>Purchase Date</th>
<th>Supplier Name</th>
<th>Qty</th>
<th>Purchase Rate</th>
<th>MRP</th>
<th>Expiry Date</th>
<th>Gst</th>
<th>Amount</th>
<th></th>
</tr>
</thead>

<tbody id="purchaseTable">
</tbody>

</table>

<div class="total-box">

Total : ₹ <span id="totalAmount">0</span>

</div>

<br>

<button id="saveBtn"  onclick="savePurchase()">
Save Purchase
</button>

</div>

</div>

<script>

let purchaseItems = [];

loadSuppliers();
loadMedicines();
let suppliers = [];
let supplierIndex = -1;

function loadSuppliers(){

    fetch("/api/suppliers")
    .then(res => res.json())
    .then(data => {

        suppliers = data;

        renderSupplierDropdown();

    })
    .catch(error => {

        console.error("Supplier loading error:", error);

    });

}
function selectSupplier(id,name){

    document.getElementById("supplierId").value =
        id;

    document.getElementById("supplierSelect").value =
        name;

    supplierDropdown.style.display =
        "none";

    supplierIndex = -1;

    document.getElementById("medicineSearch")
        .focus();

}
const supplierInput =
    document.getElementById("supplierSelect");

const supplierDropdown =
    document.getElementById("supplierDropdown");


function renderSupplierDropdown(){

    let html = "";

    suppliers.forEach(function(s){

        html += `
            <div
                data-id="${s.id}"
                data-name="${s.supplierName}">
                ${s.supplierName}
            </div>
        `;

    });

    supplierDropdown.innerHTML = html;

}
function highlightSupplier(){

    let items =
        supplierDropdown.querySelectorAll(
            "div[data-id]"
        );

    items.forEach(function(item){

        item.classList.remove("active");

    });

    if(
        supplierIndex >= 0 &&
        supplierIndex < items.length
    ){

        let selected =
            items[supplierIndex];

        selected.classList.add("active");

        selected.scrollIntoView({
            block:"nearest"
        });

    }

}
let medicines = [];
let medicineIndex = -1;

function loadMedicines(){

    fetch("/api/medicines")
    .then(res => res.json())
    .then(data => {

        medicines = data;

    })
    .catch(error => {

        console.error("Medicine loading error:", error);

    });

}


const medicineSearch =
    document.getElementById("medicineSearch");

const medicineDropdown =
    document.getElementById("medicineDropdown");


medicineSearch.addEventListener("input", function(){

    let search =
        this.value.trim().toLowerCase();

    medicineIndex = -1;

    document.getElementById("medicineSelect").value = "";


    if(search === ""){

        medicineDropdown.innerHTML = "";
        medicineDropdown.style.display = "none";

        return;

    }


    let results = medicines.filter(m => {

        let name = String(m.medicineName || "").toLowerCase();

        return name.includes(search);

    });

    let html = "";

    results.forEach(m => {

        html += `
        <div
            data-id="${m.id}"
            data-name="${m.medicineName}">
            ${m.medicineName}
        </div>
        `;

    });


    medicineDropdown.innerHTML = html;

    medicineDropdown.style.display =
        results.length > 0 ? "block" : "none";

});


medicineSearch.addEventListener("keydown", function(e){

    let items =
        medicineDropdown.querySelectorAll(
            "div[data-id]"
        );


    if(e.key === "ArrowDown"){

        if(items.length === 0) return;

        e.preventDefault();

        medicineIndex++;

        if(medicineIndex >= items.length)
            medicineIndex = 0;

        highlightMedicine(items);

    }


    if(e.key === "ArrowUp"){

        if(items.length === 0) return;

        e.preventDefault();

        medicineIndex--;

        if(medicineIndex < 0)
            medicineIndex = items.length - 1;

        highlightMedicine(items);

    }


    if(e.key === "Enter"){

        e.preventDefault();
        e.stopPropagation();

        if(
            medicineDropdown.style.display === "block" &&
            items.length > 0
        ){

            if(medicineIndex < 0)
                medicineIndex = 0;

            let selected = items[medicineIndex];

            selectMedicine(
                selected.dataset.id,
                selected.dataset.name
            );

            return;

        }


        if(
            document.getElementById("medicineSelect").value !== ""
        ){

            document.getElementById("qty").focus();

        }

    }


    if(e.key === "Escape"){

        medicineDropdown.style.display = "none";

        medicineIndex = -1;

    }

});


function highlightMedicine(items){

    items.forEach(item => {

        item.classList.remove("active");

    });


    if(medicineIndex >= 0){

        items[medicineIndex]
            .classList.add("active");

        items[medicineIndex]
            .scrollIntoView({
                block:"nearest"
            });

    }

}


function selectMedicine(id,name){

    document.getElementById("medicineSelect").value = id;

    document.getElementById("medicineSearch").value = name;

    medicineDropdown.style.display = "none";

    medicineIndex = -1;

    document.getElementById("qty").focus();

}


medicineDropdown.addEventListener("click", function(e){

    let item =
        e.target.closest("div[data-id]");

    if(!item) return;

    selectMedicine(
        item.dataset.id,
        item.dataset.name
    );

});
supplierInput.addEventListener(
	    "keydown",
	    function(e){

	        let items =
	            supplierDropdown.querySelectorAll(
	                "div[data-id]"
	            );


	        /* =========================
	           ENTER
	           Open / Select
	        ========================= */

	        if(e.key === "Enter"){

	            e.preventDefault();
	            e.stopPropagation();


	            /* OPEN */

	            if(
	                supplierDropdown.style.display !== "block"
	            ){

	                supplierDropdown.style.display =
	                    "block";

	                supplierIndex = 0;

	                highlightSupplier();

	                return;

	            }


	            /* SELECT */

	            if(items.length > 0){

	                if(supplierIndex < 0)
	                    supplierIndex = 0;

	                let selected =
	                    items[supplierIndex];

	                selectSupplier(
	                    selected.dataset.id,
	                    selected.dataset.name
	                );

	            }

	            return;
	        }


	        /* =========================
	           ARROW DOWN
	        ========================= */

	        if(e.key === "ArrowDown"){

	            e.preventDefault();
	            e.stopPropagation();


	            if(
	                supplierDropdown.style.display !== "block"
	            ){

	                supplierDropdown.style.display =
	                    "block";

	                supplierIndex = 0;

	            }
	            else{

	                supplierIndex++;

	            }


	            if(
	                supplierIndex >= items.length
	            ){

	                supplierIndex = 0;

	            }


	            highlightSupplier();

	            return;
	        }


	        /* =========================
	           ARROW UP
	        ========================= */

	        if(e.key === "ArrowUp"){

	            e.preventDefault();
	            e.stopPropagation();


	            if(
	                supplierDropdown.style.display !== "block"
	            ){

	                supplierDropdown.style.display =
	                    "block";

	                supplierIndex =
	                    items.length - 1;

	            }
	            else{

	                supplierIndex--;

	            }


	            if(supplierIndex < 0){

	                supplierIndex =
	                    items.length - 1;

	            }


	            highlightSupplier();

	            return;
	        }


	        /* =========================
	           ESC
	        ========================= */

	        if(e.key === "Escape"){

	            e.preventDefault();

	            supplierDropdown.style.display =
	                "none";

	            supplierIndex = -1;

	        }

	    }
	);
let gstIndex = -1;

const gstInput =
    document.getElementById("gst");

const gstDropdown =
    document.getElementById("gstDropdown");


function highlightGST(){

    let items =
        gstDropdown.querySelectorAll(
            "div[data-value]"
        );

    items.forEach(function(item){

        item.classList.remove("active");

    });


    if(
        gstIndex >= 0 &&
        gstIndex < items.length
    ){

        items[gstIndex]
            .classList.add("active");

        items[gstIndex]
            .scrollIntoView({
                block:"nearest"
            });

    }

}


gstInput.addEventListener(
    "keydown",
    function(e){

        let items =
            gstDropdown.querySelectorAll(
                "div[data-value]"
            );


        /* =========================
           ENTER
        ========================= */

        if(e.key === "Enter"){

            e.preventDefault();
            e.stopPropagation();


            /* OPEN */

            if(
                gstDropdown.style.display !== "block"
            ){

                gstDropdown.style.display =
                    "block";

                gstIndex = 0;

                highlightGST();

                return;

            }


            /* SELECT */

            if(items.length > 0){

                if(gstIndex < 0)
                    gstIndex = 0;

                let selected =
                    items[gstIndex];

                gstInput.value =
                    selected.dataset.value;

                gstDropdown.style.display =
                    "none";

                gstIndex = -1;

                document.getElementById("addItemBtn")
                    .focus();

            }

            return;
        }


        /* =========================
           DOWN
        ========================= */

        if(e.key === "ArrowDown"){

            e.preventDefault();
            e.stopPropagation();


            if(
                gstDropdown.style.display !== "block"
            ){

                gstDropdown.style.display =
                    "block";

                gstIndex = 0;

            }
            else{

                gstIndex++;

            }


            if(gstIndex >= items.length){

                gstIndex = 0;

            }


            highlightGST();

            return;
        }


        /* =========================
           UP
        ========================= */

        if(e.key === "ArrowUp"){

            e.preventDefault();
            e.stopPropagation();


            if(
                gstDropdown.style.display !== "block"
            ){

                gstDropdown.style.display =
                    "block";

                gstIndex =
                    items.length - 1;

            }
            else{

                gstIndex--;

            }


            if(gstIndex < 0){

                gstIndex =
                    items.length - 1;

            }


            highlightGST();

            return;
        }


        /* =========================
           ESC
        ========================= */

        if(e.key === "Escape"){

            e.preventDefault();

            gstDropdown.style.display =
                "none";

            gstIndex = -1;

        }

    }
);
function addItem(){

    let medicineId =
        document.getElementById("medicineSelect").value;

    let medicineName =
        document.getElementById("medicineSearch").value.trim();

    let invoiceNo =
        document.getElementById("invoiceNo").value.trim();

    let batchNo =
        document.getElementById("batchNo").value.trim();

    let purchaseDate =
        document.getElementById("purchaseDate").value;

    let supplierSelect =
        document.getElementById("supplierSelect");

    let supplierName = "";

    if(
        supplierSelect &&
        supplierSelect.selectedIndex >= 0 &&
        supplierSelect.options.length > 0
    ){

        supplierName =
            supplierSelect.options[
                supplierSelect.selectedIndex
            ].text.trim();

    }


    let qty =
        parseInt(
            document.getElementById("qty").value
        );

    let purchaseRate =
        parseFloat(
            document.getElementById("purchaseRate").value
        );

    let mrp =
        parseFloat(
            document.getElementById("mrp").value
        );

    let expiryDate =
        document.getElementById("expiryDate").value;

    let gst =
        parseFloat(
            document.getElementById("gst").value
        );


    /* ================= VALIDATION ================= */

    if(!medicineId){

        alert("Please select Medicine.");

        document.getElementById("medicineSearch").focus();

        return;

    }


    if(!qty || qty <= 0){

        alert("Please enter Quantity.");

        document.getElementById("qty").focus();

        return;

    }


    if(isNaN(purchaseRate)){

        alert("Please enter Purchase Price.");

        document.getElementById("purchaseRate").focus();

        return;

    }


    if(isNaN(mrp)){

        alert("Please enter MRP.");

        document.getElementById("mrp").focus();

        return;

    }


    if(!expiryDate){

        alert("Please select Expiry Date.");

        document.getElementById("expiryDate").focus();

        return;

    }


    /* ================= AMOUNT ================= */

    let amount =
        qty * purchaseRate;


    /* ================= ADD ITEM ================= */

    purchaseItems.push({

        invoiceNo: invoiceNo,

        medicineId: medicineId,

        medicineName: medicineName,

        batchNo: batchNo,

        purchaseDate: purchaseDate,

        supplierName: supplierName,

        quantity: qty,

        purchaseRate: purchaseRate,

        saleRate: mrp,

        expiryDate: expiryDate,

        gst: gst,

        amount: amount

    });


    /* ================= RENDER ================= */

    renderTable();


    /* ================= CLEAR MEDICINE ENTRY ================= */

    document.getElementById("medicineSearch").value = "";

    document.getElementById("medicineSelect").value = "";

    document.getElementById("qty").value = "";

    document.getElementById("purchaseRate").value = "";

    document.getElementById("mrp").value = "";

    document.getElementById("expiryDate").value = "";

    document.getElementById("gst").value = "0";


    /* ================= CURSOR SAVE PURCHASE ================= */

    setTimeout(function(){

        document.getElementById("saveBtn").focus();

    },100);

}

function renderTable(){

let rows="";

let total=0;

purchaseItems.forEach((item,index)=>{

total += item.amount;

rows += `
<tr>
	<td>${item.invoiceNo}</td>
<td>${item.medicineName}</td>
<td>${item.batchNo}</td>
<td>${item.purchaseDate}</td>
<td>${item.supplierName}</td>

<td>${item.quantity}</td>

<td>${item.purchaseRate}</td>
<td>${item.saleRate}</td>

            )
        ).filter(function(el){

            return el.offsetParent !== null;

        });

        fields.indexOf(active);


    if(
        index >= 0 &&
        index < fields.length - 1
    ){

        fields[index + 1].focus();

    }

/* =====================================================
PURCHASE - LEFT / RIGHT ARROW NAVIGATION
===================================================== */

document.addEventListener("keydown", function(e){

 if(
     e.key !== "ArrowLeft" &&
     e.key !== "ArrowRight"
 ){
     return;
 }


 const active =
     document.activeElement;


 /*
  * Medicine Search मध्ये typing करताना
  * Left / Right cursor movement normal राहील.
  */
 if(active.id === "medicineSearch"){
     return;
 }


 /*
  * Purchase fields order
  */
 const fields = [

     "invoiceNo",

     "purchaseDate",

     "batchNo",

     "supplierSelect",

     "medicineSearch",

     "qty",

     "purchaseRate",

     "mrp",

     "expiryDate",

     "gst",

     "addItemBtn",

     "saveBtn"

 ];


 const index =
     fields.indexOf(active.id);


 /*
  * Current element list मध्ये नसेल
  */
 if(index === -1){
     return;
 }


 /* =================================================
    RIGHT ARROW
    Next field
 ================================================= */

 if(e.key === "ArrowRight"){

     e.preventDefault();
     e.stopPropagation();


     if(index < fields.length - 1){

         const next =
             document.getElementById(
                 fields[index + 1]
             );


         if(next){

             next.focus();

         }

     }

     return;
 }


 /* =================================================
    LEFT ARROW
    Previous field
 ================================================= */

 if(e.key === "ArrowLeft"){

     e.preventDefault();
     e.stopPropagation();


     if(index > 0){

         const previous =
             document.getElementById(
                 fields[index - 1]
             );


         if(previous){

             previous.focus();

         }

     }

     return;
 }

});
</script>
