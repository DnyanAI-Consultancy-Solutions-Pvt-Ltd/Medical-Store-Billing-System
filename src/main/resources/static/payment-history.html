<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Supplier Payment History</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    margin:0;
}

.header{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    height:70px;
    background:linear-gradient(135deg,#198754,#20c997);
    color:white;
    font-size:28px;
    font-weight:bold;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.logo{
    position:absolute;
    left:20px;
    height:60px;
    width:170px;
    border-radius:12px;
}

.close-btn{
    position:absolute;
    right:20px;
    background:#dc3545;
    color:white;
    border:none;
    padding:10px 18px;
    cursor:pointer;
    border-radius:6px;
}

.container{
    padding:20px;
}

.summary{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.card{
    flex:1;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px gray;
    text-align:center;
}

.card h2{
    color:#198754;
    margin-top:10px;
}

label{
    font-weight:bold;
}

select{
    width:300px;
    padding:10px;
    margin:15px 0;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#198754;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

tr:nth-child(even){
    background:#f9f9f9;
}

</style>
</head>

<body>

<div class="header">

<img src="/images/logo.jpeg" class="logo">

Supplier Payment History

<button class="close-btn"
onclick="closePage()">
✖ Close
</button>

</div>

<div class="container">

<label>Select Supplier</label>

<select id="supplier"
onchange="loadHistory()">
</select>

<div class="summary">

<div class="card">
<h4>Total Payment</h4>
<h2 id="totalPayment">₹0</h2>
</div>

<div class="card">
<h4>Outstanding Balance</h4>
<h2 id="balance">₹0</h2>
</div>

</div>

<table>

<thead>

<tr>

<th>Payment ID</th>

<th>Date</th>

<th>Mode</th>

<th>Amount</th>

<th>Remarks</th>

</tr>

</thead>

<tbody id="paymentTable">

</tbody>

</table>

</div>

<script>
// Load Suppliers
fetch("/api/suppliers")
.then(res => res.json())
.then(data => {

    let options = "<option value=''>Select Supplier</option>";

    data.forEach(s => {

        options += `
        <option value="${s.id}">
            ${s.supplierName}
        </option>`;
    });

    document.getElementById("supplier").innerHTML = options;

});

function loadHistory(){

    let supplierId =
    document.getElementById("supplier").value;

    if(supplierId==""){
        return;
    }

    // Outstanding Balance
    fetch("/api/suppliers/" + supplierId)
    .then(res => res.json())
    .then(data => {

        document.getElementById("balance").innerHTML =
        "₹" + (data.balance==null ? 0 : data.balance);

    });

    // Payment History
    fetch("/api/payments/supplier/" + supplierId)
    .then(res => res.json())
    .then(data => {

        let rows = "";

        let total = 0;

        data.forEach(p => {

            total += p.amount;

            rows += `
            <tr>

                <td>${p.id}</td>

                <td>${p.paymentDate}</td>

                <td>${p.paymentMode}</td>

                <td>₹${p.amount}</td>

                <td>${p.remarks==null ? "" : p.remarks}</td>

            </tr>
            `;

        });

        document.getElementById("paymentTable").innerHTML =
        rows;

        document.getElementById("totalPayment").innerHTML =
        "₹" + total;

    })
    .catch(err=>{

        document.getElementById("paymentTable").innerHTML =
        "<tr><td colspan='5'>No Payment History Found</td></tr>";

        document.getElementById("totalPayment").innerHTML =
        "₹0";

    });

}

/* ENTER = NEXT FIELD */
document.addEventListener("keydown", function(e){

    if(e.key!=="Enter") return;

    e.preventDefault();

    let fields = Array.from(
        document.querySelectorAll(
        "select,input,button")
    ).filter(el=>!el.disabled);

    let index = fields.indexOf(document.activeElement);

    if(index>-1 && index<fields.length-1){

        fields[index+1].focus();

    }

});

/* Close Page */
function closePage(){

    parent.closeModal();

}
</script>
</body>
</html>
