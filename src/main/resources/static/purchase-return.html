<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Purchase Return</title>

<style>

body{
    font-family:"Segoe UI",Arial;
    background:#eef3f8;
    margin:0;
}


.header{

    background:linear-gradient(135deg,#0f4c81,#2196f3);

    color:white;

    padding:18px;

    font-size:28px;

    font-weight:bold;

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;

    box-shadow:0 3px 10px rgba(0,0,0,.2);

}


.logo{

    position:absolute;

    left:20px;

    height:55px;

    width:170px;

    border-radius:12px;

}



.close-btn{

    position:absolute;

    right:20px;

    background:#dc3545;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:6px;

    cursor:pointer;

}



.main{

    padding:20px;

}



.card{

    background:white;

    padding:15px;

    border-radius:10px;

    box-shadow:0 2px 10px rgba(0,0,0,.15);

    margin-bottom:15px;

}



h2{

    color:#0f4c81;

    margin:0 0 15px;

    border-bottom:2px solid #2196f3;

    padding-bottom:8px;

}



.row{
    display:flex;
    gap:15px;
    align-items:flex-end;
}



.field{
    flex:1;
    min-width:0;
}
.row .field{
    width:33.33%;
}

label{

    font-size:14px;

    font-weight:600;

}



input,
select{

    width:100%;

    box-sizing:border-box;

    height:38px;

    padding:8px 10px;

    margin-top:5px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:14px;

}


input:focus,
select:focus{

    border-color:#2196f3;

    outline:none;

}



.btn{

    background:#198754;

    color:white;

    border:none;
    margin-top:10px;

    padding:12px 25px;

    border-radius:8px;

    font-weight:bold;

    cursor:pointer;

}



.btn:hover{

    background:#157347;

}



table{

    width:100%;

    border-collapse:collapse;

    margin-top:15px;

}



th{

    background:#198754;

    color:white;

    padding:10px;

}



td{

    border:1px solid #ddd;

    padding:8px;

    text-align:center;

}



.history-title{

    color:#0f4c81;

    margin-top:10px;

}

</style>

</head>

<body>

<div class="header">

<img src="/images/logo.jpeg" class="logo">

<span>Purchase Return</span>

<button class="close-btn" onclick="closePage()">
✖ Close
</button>

</div>


<div class="main">


<div class="card">

<h2>Purchase Return Details</h2>


<div class="row">

<div class="field">
<label>Supplier</label>
<select id="supplier"></select>
</div>


<div class="field">
<label>Invoice No</label>
<input type="text" id="invoiceNo">
</div>









<div class="field">

<label>Medicine</label>

<div style="position:relative;">

<input
    type="text"
    id="medicineSearch"
    placeholder="Search Medicine..."
    autocomplete="off"
>

<input type="hidden" id="medicine">

<div id="medicineDropdown"
style="
    display:none;
    position:absolute;
    top:45px;
    left:0;
    width:100%;
    max-height:220px;
    overflow-y:auto;
    background:white;
    border:1px solid #ccc;
    border-radius:6px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
    z-index:9999;
">
</div>

</div>

</div>
</div>
<div class="row">
<div class="field">

<label>Return Quantity</label>

<input type="number" id="quantity">

</div>


<div class="field">

<label>Amount</label>

<input type="number" id="amount">

</div>




<div class="field">

<label>Reason</label>

<input type="text" id="reason">
</div>
</div>
<center>
<button id="saveBtn" class="btn" onclick="saveReturn()">
Save Purchase Return
</button>

</center>


</div>



<div class="card">

<h2 class="history-title">
Purchase Return History
</h2>


<table>

<thead>
<tr>
<th>ID</th>
<th>Supplier</th>
<th>Medicine</th>
<th>Qty</th>
<th>Reason</th>
<th>Date</th>
</tr>
</thead>

<tbody id="returnTable">

</tbody>


</table>


</div>


</div>


<script>

/* Load Suppliers */

fetch("/api/suppliers")
.then(res => res.json())
.then(data => {

let rows = "";

data.forEach(s => {

rows += `
<option value="${s.id}">
${s.supplierName}
</option>
`;

});

document.getElementById("supplier").innerHTML =
rows;

});

/* =====================================================
MEDICINE SEARCH
===================================================== */

let medicines = [];
let medicineIndex = -1;

const medicineSearch =
 document.getElementById("medicineSearch");

const medicineDropdown =
 document.getElementById("medicineDropdown");


/* LOAD MEDICINES */

fetch("/api/medicines")
.then(res => res.json())
.then(data => {

 medicines = Array.isArray(data) ? data : [];

})
.catch(error => {

 console.error("Medicine loading error:", error);

});


/* =====================================================
SEARCH
===================================================== */

medicineSearch.addEventListener("input", function(){

 let text =
     this.value.trim().toLowerCase();

 medicineIndex = -1;

 document.getElementById("medicine").value = "";

 medicineDropdown.innerHTML = "";


 if(text === ""){

     medicineDropdown.style.display = "none";

     return;

 }


 let results = medicines.filter(function(m){

     return (
         m.medicineName &&
         m.medicineName
             .toLowerCase()
             .includes(text)
     );

 });


 results.forEach(function(m){

     let div = document.createElement("div");

     div.textContent = m.medicineName;

     div.dataset.id = m.id;

     div.style.padding = "10px";
     div.style.cursor = "pointer";
     div.style.borderBottom = "1px solid #eee";


     div.addEventListener("click", function(){

         selectMedicine(
             m.id,
             m.medicineName
         );

     });


     medicineDropdown.appendChild(div);

 });


 if(results.length > 0){

     medicineDropdown.style.display = "block";

 }else{

     medicineDropdown.style.display = "none";

 }

});


/* =====================================================
MEDICINE KEYBOARD
Arrow Up / Down
Enter = Select
===================================================== */

medicineSearch.addEventListener("keydown", function(e){

 let items =
     medicineDropdown.querySelectorAll(
         "div[data-id]"
     );


 /* ARROW DOWN */

 if(e.key === "ArrowDown"){

     if(items.length === 0)
         return;

     e.preventDefault();

     medicineIndex++;

     if(medicineIndex >= items.length){

         medicineIndex = 0;

     }

     highlightMedicine(items);

     return;
 }


 /* ARROW UP */

 if(e.key === "ArrowUp"){

     if(items.length === 0)
         return;

     e.preventDefault();

     medicineIndex--;

     if(medicineIndex < 0){

         medicineIndex =
             items.length - 1;

     }

     highlightMedicine(items);

     return;
 }


 /* ENTER */

 if(e.key === "Enter"){

     e.preventDefault();
     e.stopPropagation();


     if(items.length > 0){

         if(medicineIndex < 0){

             medicineIndex = 0;

         }


         let selected =
             items[medicineIndex];


         selectMedicine(
             selected.dataset.id,
             selected.textContent
         );


         return;

     }


     /*
      * Medicine already selected
      * -> Quantity
      */

     if(
         document.getElementById("medicine").value !== ""
     ){

         document
             .getElementById("quantity")
             .focus();

     }

 }

});


/* =====================================================
HIGHLIGHT
===================================================== */

function highlightMedicine(items){

 items.forEach(function(item){

     item.style.background = "";
     item.style.color = "";

 });


 if(medicineIndex >= 0){

     items[medicineIndex].style.background =
         "#2196f3";

     items[medicineIndex].style.color =
         "white";


     items[medicineIndex].scrollIntoView({
         block:"nearest"
     });

 }

}


/* =====================================================
SELECT MEDICINE
===================================================== */

function selectMedicine(id, name){

 document.getElementById("medicine").value =
     id;

 document.getElementById("medicineSearch").value =
     name;

 medicineDropdown.style.display =
     "none";

 medicineIndex = -1;


 /*
  * Medicine नंतर Quantity
  */

 document.getElementById("quantity").focus();

}

/* Save Purchase Return */
function saveReturn(){

    let supplier =
        document.getElementById("supplier");

    let invoiceNo =
        document.getElementById("invoiceNo");

    let medicine =
        document.getElementById("medicine");

    let quantity =
        document.getElementById("quantity");

    let amount =
        document.getElementById("amount");

    let reason =
        document.getElementById("reason");


    /* =========================
       SUPPLIER VALIDATION
    ========================= */

    if(!supplier.value){

        alert("Please select Supplier.");

        supplier.focus();

        return;
    }


    /* =========================
       INVOICE VALIDATION
    ========================= */

    if(!invoiceNo.value.trim()){

        alert("Please enter Invoice No.");

        invoiceNo.focus();

        return;
    }


    /* =========================
       MEDICINE VALIDATION
    ========================= */

    if(!medicine.value){

        alert("Please select Medicine.");

        document.getElementById("medicineSearch").focus();

        return;
    }


    /* =========================
       QUANTITY VALIDATION
    ========================= */

    if(
        !quantity.value ||
        Number(quantity.value) <= 0
    ){

        alert("Please enter valid Return Quantity.");

        quantity.focus();

        return;
    }


    /* =========================
       AMOUNT VALIDATION
    ========================= */

    if(
        !amount.value ||
        Number(amount.value) <= 0
    ){

        alert("Please enter valid Amount.");

        amount.focus();

        return;
    }


    /* =========================
       REASON VALIDATION
    ========================= */

    if(!reason.value.trim()){

        alert("Please enter Return Reason.");

        reason.focus();

        return;
    }


    /* =========================
       REQUEST
    ========================= */

    const data = {

        supplierId:
            supplier.value,

        invoiceNo:
            invoiceNo.value.trim(),

        medicineId:
            medicine.value,

        quantity:
            Number(quantity.value),

        reason:
            reason.value.trim(),

        amount:
            Number(amount.value)

    };


    /* =========================
       SAVE
    ========================= */

    fetch("/api/purchase-returns", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(data)

    })

    .then(async res => {

        if(!res.ok){

            let message =
                await res.text();

            throw new Error(
                message || "Save failed"
            );

        }

        return res.json();

    })

    .then(data => {

        alert("Purchase Return Saved");

        location.reload();

    })

    .catch(error => {

        console.error(
            "Purchase Return Error:",
            error
        );

        alert(
            "Purchase Return save failed."
        );

    });

}

/* History */

fetch("/api/purchase-returns")
.then(res => res.json())
.then(data => {

let rows = "";

data.forEach(r => {

rows += `
<tr>

<td>${r.id}</td>

<td>
${r.supplier ?
r.supplier.supplierName : ''}
</td>

<td>
${r.medicine ?
r.medicine.medicineName : ''}
</td>

<td>${r.quantity}</td>

<td>${r.reason}</td>

<td>${r.returnDate}</td>

</tr>
`;

});

document.getElementById("returnTable")
.innerHTML = rows;

});
/* =====================================================
PURCHASE RETURN KEYBOARD HANDLING
===================================================== */

document.addEventListener("keydown", function(e){

 let active = document.activeElement;


 /* =================================================
    LEFT / RIGHT ARROW = PREVIOUS / NEXT FIELD
    पण SELECT मध्ये LEFT / RIGHT native राहू द्या
 ================================================= */

 if(
     (e.key === "ArrowLeft" || e.key === "ArrowRight") &&
     active.tagName !== "SELECT"
 ){

     let fields = Array.from(
         document.querySelectorAll(
             'input:not([type="hidden"]):not([disabled]),' +
             'select:not([disabled]),' +
             'button:not([disabled])'
         )
     ).filter(function(el){

         return el.offsetParent !== null;

     });


     let index = fields.indexOf(active);


     if(e.key === "ArrowRight"){

         if(index < fields.length - 1){

             e.preventDefault();

             fields[index + 1].focus();

         }

     }


     if(e.key === "ArrowLeft"){

         if(index > 0){

             e.preventDefault();

             fields[index - 1].focus();

         }

     }

     return;
 }


 /* =================================================
    ENTER
 ================================================= */

 if(e.key !== "Enter")
     return;


 if(active.tagName === "TEXTAREA")
     return;


 /* =================================================
    SUPPLIER
    FIRST ENTER = OPEN DROPDOWN
    ARROW UP/DOWN = SELECT
    SECOND ENTER = NEXT FIELD
 ================================================= */

 if(active.id === "supplier"){

     e.preventDefault();
     e.stopPropagation();


     /*
      * Native dropdown open
      */

     if(!active.dataset.open){

         active.dataset.open = "true";

         if(typeof active.showPicker === "function"){

             try{

                 active.showPicker();

             }catch(err){

                 console.log(err);

             }

         }

         return;
     }


     /*
      * Dropdown already opened
      * Enter = next field
      */

     active.dataset.open = "";

     document
         .getElementById("invoiceNo")
         .focus();

     return;
 }


 /* =================================================
    INVOICE NO
    ENTER = MEDICINE
 ================================================= */

 if(active.id === "invoiceNo"){

     e.preventDefault();
     e.stopPropagation();


     if(!active.value.trim()){

         alert("Please enter Invoice No.");

         active.focus();

         return;
     }


     document
         .getElementById("medicineSearch")
         .focus();

     return;
 }


 /* =================================================
    MEDICINE SEARCH
    Enter handled by medicine search code
 ================================================= */

 if(active.id === "medicineSearch"){

     return;
 }


 /* =================================================
    QUANTITY
 ================================================= */

 if(active.id === "quantity"){

     e.preventDefault();
     e.stopPropagation();


     if(
         !active.value ||
         Number(active.value) <= 0
     ){

         alert("Please enter valid Return Quantity.");

         active.focus();

         return;
     }


     document
         .getElementById("amount")
         .focus();

     return;
 }


 /* =================================================
    AMOUNT
 ================================================= */

 if(active.id === "amount"){

     e.preventDefault();
     e.stopPropagation();


     if(
         !active.value ||
         Number(active.value) <= 0
     ){

         alert("Please enter valid Amount.");

         active.focus();

         return;
     }


     document
         .getElementById("reason")
         .focus();

     return;
 }


 /* =================================================
    REASON
 ================================================= */

 if(active.id === "reason"){

     e.preventDefault();
     e.stopPropagation();


     if(!active.value.trim()){

         alert("Please enter Return Reason.");

         active.focus();

         return;
     }


     document
         .getElementById("saveBtn")
         .focus();

     return;
 }


 /* =================================================
    SAVE
    ENTER = CLICK
 ================================================= */

 if(active.id === "saveBtn"){

     e.preventDefault();
     e.stopPropagation();

     active.click();

     return;
 }

});
window.onload = function(){

    document.getElementById("supplier").focus();

};
function closePage(){

    parent.closeModal();

}
</script>

</body>
</html>
