<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GST Master</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#0f4c81;
margin-bottom:20px;
}

label{
font-weight:bold;
display:block;
margin-top:10px;
}

input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#2196f3;
color:white;
border:none;
padding:12px;
margin-top:15px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#1976d2;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th{
background:#2196f3;
color:white;
padding:10px;
}

td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

.close-btn{
float:right;
background:red;
color:white;
border:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<button class="close-btn"
onclick="parent.closeModal()">
✖ Close
</button>

<h2>GST Master</h2>

<label>GST Name</label>
<input type="text"
id="gstName"
placeholder="GST 5%">

<label>GST Percentage</label>
<input type="number"
id="gstPercentage"
placeholder="5">

<button onclick="saveGST()">
Save GST
</button>

<h3>GST List</h3>

<table>

<thead>
<tr>
<th>ID</th>
<th>GST Name</th>
<th>GST %</th>
</tr>
</thead>

<tbody id="gstTable">
</tbody>

</table>

</div>

<script>

loadGST();

function saveGST(){

let gst = {

gstName:
document.getElementById("gstName").value,

gstPercentage:
parseFloat(
document.getElementById("gstPercentage").value
)

};

fetch("/api/gst-master",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(gst)

})
.then(res=>res.json())
.then(data=>{

alert("GST Saved Successfully");

document.getElementById("gstName").value="";
document.getElementById("gstPercentage").value="";

loadGST();

});

}

function loadGST(){

fetch("/api/gst-master")

.then(res=>res.json())

.then(data=>{

let rows="";

data.forEach(g=>{

rows += `
<tr>

<td>${g.id}</td>

<td>${g.gstName}</td>

<td>${g.gstPercentage}%</td>

</tr>
`;

});

document.getElementById("gstTable")
.innerHTML = rows;

});

}

</script>

</body>
</html>
