<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>inventory </title>
</head>
<style>

.header{
background:linear-gradient(135deg,#0f4c81,#2196f3);
color:white;
padding:15px;
font-size:28px;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.2);
    display:flex;
    align-items:center;
    justify-content:space-between;
     position:relative;
 
}
.close-btn{

    position:absolute;

    right:20px;

    top:50%;

    transform:translateY(-50%);

    background:#dc3545;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:6px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

}

.close-btn:hover{

    background:#bb2d3b;

}
.logo{
    height:60px;
    width:170px;
    
    margin-left:10px;
    border-radius: 15px;  
}
.title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:28px;
    font-weight:bold;
    font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}
body{
    font-family:Arial,sans-serif;
    background:#eef3f8;
    margin:20px;
}

.inventory-actions{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.btn{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 12px rgba(0,0,0,.2);
}

.btn-primary{
    background:#0d6efd;
}

.btn-warning{
    background:#f39c12;
}

.btn-danger{
    background:#dc3545;
}

.btn-success{
    background:#198754;
}

.table-container{
    background:#fff;
    padding:15px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    overflow-x:auto;
}

.inventory-table{
    width:100%;
    border-collapse:collapse;
}

.inventory-table th{
    background:#0f4c81;
    color:white;
    padding:12px;
    text-align:center;
}

.inventory-table td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

.inventory-table tr:nth-child(even){
    background:#f8f9fa;
}

.inventory-table tr:hover{
    background:#d6ecff;
}
.schedule-cards{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    gap:20px;

    margin:20px 0;

}

.schedule-card{

    background:white;

    border-radius:12px;

    padding:20px;

    text-align:center;

    cursor:pointer;

    transition:.3s;

    box-shadow:0 3px 10px rgba(0,0,0,.15);

}

.schedule-card:hover{

    transform:translateY(-5px);

    box-shadow:0 8px 20px rgba(0,0,0,.25);

}

.schedule-card h3{

    margin:0;

    color:#0f4c81;

    font-size:20px;

}

.schedule-card span{

    display:block;

    margin-top:15px;

    font-size:34px;

    font-weight:bold;

}

.h{

    border-top:5px solid #0d6efd;

}

.h1{

    border-top:5px solid #198754;

}

.x{

    border-top:5px solid #dc3545;

}

.otc{

    border-top:5px solid #f39c12;

}
</style>


<div class="header">

<img src="/images/logo.jpeg" class="logo">
<span class="title">Inventory Management</span>
<button class="close-btn" onclick="closePage()">
        ✖ Close
    </button>
</div>
<br><br>
<div class="inventory-actions">

    <button class="btn btn-primary" onclick="loadInventory()">
        📦 All Inventory
    </button>

    <button class="btn btn-warning" onclick="loadLowStock()">
        ⚠ Low Stock
    </button>

    <button class="btn btn-danger" onclick="loadOutOfStock()">
        ✖ Out Of Stock
    </button>

    <button class="btn btn-success" onclick="loadExpiringSoon()">
        ⏳ Expiring Soon
    </button>

</div>

<div class="table-container">

<table class="inventory-table">

<thead>

<tr>
<th>ID</th>
<th>Medicine</th>
<th>Company</th>
<th>MRP</th>
<th>Stock</th>
<th>Expiry Date</th>
</tr>

</thead>

<tbody id="inventoryBody"></tbody>

</table>

</div><script>

function renderTable(data){

let rows = "";

data.forEach(medicine => {

rows += `
<tr>
<td>${medicine.id}</td>
<td>${medicine.medicineName}</td>
<td>${medicine.companyName}</td>
<td>${medicine.mrp}</td>
<td>${medicine.quantity}</td>
<td>${medicine.expiryDate}</td>
</tr>
`;

});

document.getElementById("inventoryBody").innerHTML = rows;

}

function loadInventory(){

fetch("/api/inventory")
.then(res => res.json())
.then(data => renderTable(data));

}

function loadLowStock(){

fetch("/api/inventory/low-stock")
.then(res => res.json())
.then(data => renderTable(data));

}

function loadOutOfStock(){

fetch("/api/inventory/out-of-stock")
.then(res => res.json())
.then(data => renderTable(data));

}
function loadExpiringSoon(){

	fetch("/api/inventory/expiring-soon")

	.then(res => res.json())

	.then(data => {

	renderTable(data);

	});

	}
function closePage(){

    parent.closeModal();

}
function loadSchedule(type){

    fetch("/api/inventory/schedule/" + type)

    .then(res=>res.json())

    .then(data=>{

        renderTable(data);

    });

}
function loadScheduleCount(){

    fetch("/api/inventory/schedule-count")

    .then(res=>res.json())

    .then(data=>{

        document.getElementById("countH").innerHTML=data.H || 0;

        document.getElementById("countH1").innerHTML=data.H1 || 0;

        document.getElementById("countX").innerHTML=data.X || 0;

        document.getElementById("countOTC").innerHTML=data.OTC || 0;

    });

}
window.onload=function(){


    loadScheduleCount();

}
</script>

</body>
</html>
