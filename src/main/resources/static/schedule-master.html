<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Schedule Master</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

input,textarea{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
}

button{
background:#2196f3;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:5px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th{
background:#2196f3;
color:white;
padding:10px;
}

td{
border:1px solid #ddd;
padding:10px;
}

.close-btn{
float:right;
background:red;
}

</style>

</head>

<body>

<div class="container">

<button class="close-btn"
onclick="parent.closeModal()">
✖ Close
</button>

<h2>Schedule Master</h2>

<input type="text"
id="scheduleName"
placeholder="Schedule H">

<textarea
id="description"
placeholder="Description">
</textarea>

<button onclick="saveSchedule()">
Save Schedule
</button>

<table>

<thead>
<tr>
<th>ID</th>
<th>Schedule</th>
<th>Description</th>
</tr>
</thead>

<tbody id="scheduleTable">
</tbody>

</table>

</div>

<script>

loadSchedules();

function saveSchedule(){

let data={

scheduleName:
document.getElementById("scheduleName").value,

description:
document.getElementById("description").value

};

fetch("/api/schedule-master",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

})
.then(res=>res.json())
.then(()=>{

alert("Schedule Saved");

loadSchedules();

});

}

function loadSchedules(){

fetch("/api/schedule-master")

.then(res=>res.json())

.then(data=>{

let rows="";

data.forEach(s=>{

rows+=`
<tr>

<td>${s.id}</td>

<td>${s.scheduleName}</td>

<td>${s.description}</td>

</tr>
`;

});

document.getElementById(
"scheduleTable"
).innerHTML=rows;

});

}

</script>

</body>
</html>
