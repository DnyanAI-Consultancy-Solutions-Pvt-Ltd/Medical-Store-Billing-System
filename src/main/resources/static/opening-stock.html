<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Opening Stock Entry</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 2px 10px gray;
}

h2{
text-align:center;
color:#0f4c81;
margin-bottom:20px;
}

label{
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#2196f3;
color:white;
border:none;
padding:12px;
width:100%;
cursor:pointer;
border-radius:5px;
font-size:16px;
}

button:hover{
background:#1976d2;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th{
background:#2196f3;
color:white;
padding:10px;
}

td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h2>Opening Stock Entry</h2>

<label>Medicine</label>
<select id="medicine"></select>

<label>Opening Quantity</label>
<input type="number" id="quantity">

<label>Opening Date</label>
<input type="date" id="openingDate">

<button onclick="saveOpeningStock()">
Save Opening Stock
</button>

<hr>

<h3>Opening Stock History</h3>

<table>

<thead>
<tr>
<th>ID</th>
<th>Medicine</th>
<th>Quantity</th>
<th>Date</th>
</tr>
</thead>

<tbody id="stockTable">
</tbody>

</table>

</div>

<script>

/* Load Medicines */

fetch("/api/medicines")
.then(res => res.json())
.then(data => {

let rows = "";

data.forEach(m => {

rows += `
<option value="${m.id}">
${m.medicineName}
</option>
`;

});

document.getElementById("medicine").innerHTML = rows;

});


/* Save Opening Stock */

function saveOpeningStock(){

const data = {

medicineId:
document.getElementById("medicine").value,

quantity:
document.getElementById("quantity").value,

openingDate:
document.getElementById("openingDate").value

};

fetch("/api/opening-stock",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

})
.then(res => res.json())
.then(data => {

alert("Opening Stock Added");

location.reload();

});

}


/* Opening Stock History */

fetch("/api/opening-stock")
.then(res => res.json())
.then(data => {

let rows = "";

data.forEach(s => {

rows += `
<tr>

<td>${s.id}</td>

<td>
${s.medicine ?
s.medicine.medicineName : ''}
</td>

<td>${s.quantity}</td>

<td>${s.openingDate}</td>

</tr>
`;

});

document.getElementById("stockTable").innerHTML = rows;

});

</script>

</body>
</html>
