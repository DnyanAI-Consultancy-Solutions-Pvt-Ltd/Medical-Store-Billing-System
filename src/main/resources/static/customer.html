<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medicine Management</title>

<style>

body{
    font-family: Arial;
    background:#f4f6f9;
    margin:0;
}

.navbar{
    background:#2c3e50;
    color:white;
    padding:15px;
    font-size:22px;
}

.menu{
    background:white;
    padding:15px;
    text-align:center;
}

.menu a{
    text-decoration:none;
    margin:20px;
    font-weight:bold;
    color:#2c3e50;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 2px 5px gray;
}

input{
    width:250px;
    padding:10px;
    margin:10px;
}

button{
    padding:10px 15px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#3498db;
    color:white;
}

</style>

</head>

<body><div class="navbar">
Medical Billing System
</div>

<div class="menu">

<a href="dashboard.html">Dashboard</a>

<a href="medicine.html">Medicine</a>

<a href="customer.html">Customer</a>

<a href="billing.html">Billing</a>

<a href="inventory.html">Inventory</a>

</div>
<div class="container">

<h2>Customer Management</h2>
<input type="hidden" id="customerId">
<div class="card">

<h3>Add / Update Customer</h3>
<b><label>Customer Name:</label></b>
<input
type="text"
id="customerName"
placeholder="Customer Name">
<b><label>Mobile No: </label></b>
<input
type="text"
id="mobileNo"
placeholder="Mobile Number">
<b><label>Address: </label></b>
<input
type="text"
id="address"
placeholder="address">

<b><label>Balance: </label></b>
<input
type="number"
id="balance"
placeholder="0">

<br>

<button onclick="saveCustomer()">
Save Customer
</button>

</div>
<div class="card" style="margin-top:20px;">

<h3>Customer List</h3>

<table>

<thead>

<tr>

<th>ID</th>
<th>Customer Name</th>
<th>Mobile No</th>
<th>Address</th>

<th>Balance</th>

<th>Action</th>

</tr>

</thead>

<tbody id="customerTable">

</tbody>

</table>

</div>
<script>
loadCustomers();
function loadCustomers(){

	fetch("/api/customers")

	.then(res=>res.json())

	.then(data=>{

	let rows="";

	data.forEach(c=>{

	rows += `

	<tr>

	<td>${c.id}</td>

	<td>${c.customerName}</td>

	<td>${c.mobileNo}</td>
	<td>${c.address}</td>
	<td>${c.balance}</td>
	<td>

	<button onclick="editCustomer(${c.id})">
	Edit
	</button>

	<button onclick="deleteCustomer(${c.id})">
	Delete
	</button>

	</td>

	</tr>

	`;

	});

	document.getElementById("customerTable").innerHTML
	= rows;

	});

	}
function saveCustomer(){

	let id =
	document.getElementById("customerId").value;

	let customer = {

	customerName:
	document.getElementById("customerName").value,

	mobileNo:
	document.getElementById("mobileNo").value,

	address:
		document.getElementById("address").value,
		balance:
			document.getElementById("balance").value
		
	};

	let url="/api/customers";

	let method="POST";

	if(id){

	url="/api/customers/"+id;

	method="PUT";

	}

	fetch(url,{

	method:method,

	headers:{
	"Content-Type":"application/json"
	},

	body:JSON.stringify(customer)

	})
	.then(()=>{

	alert("Customer Saved");

	loadCustomers();

	document.getElementById("customerName").value="";
	document.getElementById("mobileNo").value="";

	});

	}
	
function editCustomer(id){

	fetch("/api/customers/"+id)

	.then(res=>res.json())

	.then(c=>{

	document.getElementById("customerId").value =
	c.id;

	document.getElementById("customerName").value =
	c.customerName;

	document.getElementById("mobileNo").value =
	c.mobileNo;
	document.getElementById("balance").value =
		c.balance;
	document.getElementById("address").value =
		c.address;

	});

	}
function deleteCustomer(id){

	if(confirm("Delete Customer ?")){

	fetch("/api/customers/"+id,{

	method:"DELETE"

	})
	.then(()=>{

	loadCustomers();

	});

	}

	}
</script>
</div>
</body>
</html>
