body{

background:#eef3f8;

.navbar{

 text-align: center;

padding:20px;
font-size:28px;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.2);

.header{
background:#198754;
color:white;
padding:20px;

.logo{
 position:absolute;

.modal{

.row{

table{

th{

td{

.action-buttons{

}

@media print{

body *{
visibility:hidden;

#printArea,
#printArea *{

#printArea{
position:absolute;
left:0;
top:0;
width:100%;

display:none;

}

.receipt{

margin:auto;
font-family:monospace;

.receipt h2{
text-align:center;
}

.receipt hr{
border:1px dashed black;

.bill-summary{

}

</head>

<body>

<div class="header">
<img src="/images/logo.jpeg" class="logo">
<span>Medical Billing System</span>
</div>

<div class="container">

<div class="card">


<h3>Invoice Details</h3>
<div class="row">
<div class="invoice-row">
<b><label>Bill No : </label></b>
<input type="text"
id="invoiceNo" readonly>
<b><label>Bill Date : </label></b>
<input type="date"
id="billDate">


<div style="position:relative;width:250px;">
<input type="hidden" id="customerId">
<input type="text"
       id="customerSearch"
       placeholder="Search Customer"
       onkeyup="filterCustomers()">
       <input type="hidden" id="customerId">

<div id="customerDropdown"
     style="
     position:absolute;
     width:100%;
     background:white;
     border:1px solid #ccc;
     max-height:150px;
     overflow-y:auto;
     display:none;
     z-index:1000;">
</div>

</div>
<b><label>Type :</label></b>
<select id="billType">
<option value="Cash">Cash</option>
<option value="Credit">Credit</option>
</select>

</div>
</div>
</div>

<div class="card">
<div class="row">

<h3>Add Medicines</h3>
<div style="position:relative;width:250px;">

<input type="text"
       id="medicineSearch"
       placeholder="Search Medicine"
       onkeyup="filterMedicines()">

     style="
     position:absolute;
     width:100%;
     background:white;
     border:1px solid #ccc;
     max-height:150px;
     overflow-y:auto;
     display:none;

</div>

id="quantity"
placeholder="Quantity">

onclick="addMedicine()">
Add Item

</div>
<div class="table-container">
    <table id="billTable">

<thead>

<tr>
<th>Sr No:</th>
<th>Product</th>

<th>Qty</th>
<th>Unit</th>
<th>Rate</th>

</div>
<table>

<thead>

<tr>

</td>

<script>

let medicines = [];
let billItems = [];

loadCustomers();
loadMedicines();

let customers = [];

function loadCustomers(){

fetch("/api/customers")
.then(res => res.json())
.then(data => {

    customers = data;

});
}
function filterCustomers(){

	let search =
	document.getElementById("customerSearch")
	.value.toLowerCase();

	let dropdown =
	document.getElementById("customerDropdown");

	let html = "";

	customers
	.filter(c =>
	c.customerName.toLowerCase().includes(search)
	)
	.forEach(c => {

		html += `
			<div onclick="selectCustomer(${c.id}, '${c.customerName}')"
			     style="padding:8px;cursor:pointer;">
			     ${c.customerName}
			</div>
			`;

	});

	dropdown.innerHTML = html;

	dropdown.style.display =
	html ? "block" : "none";
	}
function selectCustomer(id, name){

    document.getElementById("customerSearch").value = name;

    document.getElementById("customerId").value = id;

    document.getElementById("customerDropdown").style.display = "none";
}function loadMedicines(){
	let options = "";

	medicines.forEach(m => {
	    options += `
	    <option value="${m.medicineName}">
	    `;
	});

	fetch("/api/medicines")
	.then(res => res.json())
	.then(data => {

	    medicines = data;

	    let html = "";

	    data.forEach(m => {

	        html += `
	        <div onclick="selectMedicine('${m.medicineName}')"
	             style="padding:8px;cursor:pointer;">
	            ${m.medicineName}
	        </div>
	        `;
	    });

	    document.getElementById("medicineDropdown").innerHTML = html;

	});

}
function filterMedicines(){

	let search =
	document.getElementById("medicineSearch")
	.value.toLowerCase();

	let dropdown =
	document.getElementById("medicineDropdown");

	let html = "";

	medicines
	.filter(m =>
	m.medicineName.toLowerCase().includes(search)
	)
	.forEach(m => {

	html += `
	<div onclick="selectMedicine('${m.medicineName}')"
	     style="padding:8px;cursor:pointer;">
	     ${m.medicineName}
	</div>
	`;

	});

	dropdown.innerHTML = html;

	dropdown.style.display =
	html ? "block" : "none";

	}
function selectMedicine(name){

	document.getElementById("medicineSearch").value =
	name;

	document.getElementById("medicineDropdown").style.display =
	"none";

	}
function addMedicine(){
	let medicineName =
		document.getElementById("medicineSearch").value;

		let medicine =
		medicines.find(
		m => m.medicineName === medicineName
		);

		if(!medicine){
		alert("Select valid medicine");
		return;
		}
let qty =
	parseInt(document.getElementById("quantity").value);

	
document.getElementById("stockInfo").innerText =
	medicine.quantity || 0;
	document.getElementById("mrpInfo").innerText =
	medicine.mrp || 0;

	document.getElementById("purchasePriceInfo").innerText =
	medicine.purchasePrice || 0;

	document.getElementById("marginInfo").innerText =
	medicine.marginPercent || 0;

	document.getElementById("contentsInfo").innerText =
	medicine.contents || "-";

	document.getElementById("symptomsInfo").innerText =
	medicine.symptoms || "-";

//STOCK CHECK

if(medicine.quantity <= 0){

    alert("❌ Out Of Stock");

    return;
}

// EXPIRY CHECK
let today = new Date();

let expiryDate =
new Date(medicine.expiryDate);

if(expiryDate < today){

alert(
"❌ Medicine Expired. Billing Not Allowed"
);

return;
}
let amount =
medicine.mrp * qty;
if(qty > medicine.quantity){

    alert(
    "❌ Available Stock : " +
    medicine.quantity
    );

    return;
}
if(
		medicine.scheduleType === "Schedule H" ||
		medicine.scheduleType === "Schedule H1" ||
		medicine.scheduleType === "Schedule X"
		){
		    alert(
		      "⚠ Prescription Required For " +
		      medicine.medicineName
		    );
		}
billItems.push({

medicineId: medicine.id,
medicineName: medicine.medicineName,
batchNo: medicine.batchNo,

quantity: qty,
unit: medicine.unit,
unitPrice: medicine.mrp,
amount: amount


});

renderTable();

}
window.onload = function(){

	let today = new Date()
	.toISOString()
	.split('T')[0];

	document.getElementById("billDate").value =
	today;

	}
function renderTable(){

let html="";
let subtotal=0;

billItems.forEach((item,index)=>{

subtotal += item.amount;

html += `
<tr>

<td>${index+1}</td>

<td>${item.medicineName}</td>
<td>${item.batchNo}</td>



<td>
<input type="number"
value="${item.quantity}"
onchange="calculateRow(this)">
</td>
<td>${item.unit}</td>

<td>
<input type="number"
value="${item.unitPrice}"
onchange="calculateRow(this)">
</td>

<td class="amount">
${item.amount}
</td>
<td>
<button onclick="removeItem(${index})">
X
</button>
</td>

</tr>
`;

});

document.getElementById("billBody").innerHTML = html;

document.getElementById("subTotal").innerText = subtotal;

calculateTotal();

}

function removeItem(index){

billItems.splice(index,1);

renderTable();

}

function calculateTotal(){

let subtotal =
parseFloat(document.getElementById("subTotal").innerText);

let gst = subtotal * 0.18;

let discount =
parseFloat(document.getElementById("discount").value || 0);

let net = subtotal + gst - discount;

document.getElementById("gst").innerText =
gst.toFixed(2);

document.getElementById("net").innerText =
net.toFixed(2);

}

			}

			.bill{
			    width:700px;
			    margin:auto;

			    padding:15px;
			}

			.header{
			    text-align:center;
			    border-bottom:1px solid #000;
			    padding-bottom:10px;
			}

			.header h2{
			    margin:0;
			}

			table{
			    width:100%;
			    border-collapse:collapse;
			    margin-top:10px;
			}

			th,td{
			    border:1px solid #000;
			    padding:6px;
			    text-align:center;
			}

			.summary{
			    margin-top:15px;
			    text-align:right;
			}

			.footer{

			    margin-top:20px;
			    font-weight:bold;
			}

			<body>

			<div class="bill">

			<div class="header">
			    <h2>🏥 MEDICAL STORE</h2>
			    <p>Medical Billing System</p>
			</div>

			${billContent}

			<div class="footer">
			    Thank You Visit Again
			</div>

			</div>

			</body>
			</html>
			`);
	win.document.close();

	});

}

function medicineChanged(){

	let medicineId =
	document.getElementById("medicineSelect").value;

	let medicine =
	medicines.find(m => m.id == medicineId);

	document.getElementById("contentsView")
	.innerText = medicine.contents || "";

	document.getElementById("symptomsView")
	.innerText = medicine.symptoms || "";

	document.getElementById("marginView")
	.innerText = medicine.marginPercent || 0;
	}

function calculateRow(element){

	let row = element.parentElement.parentElement;

	let qty =
	row.cells[3].querySelector("input").value;

	let rate =
	row.cells[5].querySelector("input").value;

	let amount = qty * rate;

	row.cells[6].innerHTML = amount.toFixed(5);
