<body>

 <button class="close-btn" onclick="closePage()">

<script>

let medicines = [];
let billItems = [];

loadCustomers();
loadMedicines();

let customers = [];

function loadCustomers(){

fetch("/api/customers")
.then(res => res.json())
.then(data => {

    customers = data;

});
}
function filterCustomers(event){
	 if(event &&
		      (event.key==="ArrowUp" ||
		       event.key==="ArrowDown" ||
		       event.key==="Enter" ||
		       event.key==="Escape")){
		        return;
		    }

	let search =
	document.getElementById("customerSearch")
	.value.toLowerCase();

	let dropdown =
	document.getElementById("customerDropdown");
	  // Search box blank asel tar dropdown close
    if(search === ""){

        dropdown.innerHTML = "";

        dropdown.style.display = "none";

        return;

    }
	let html = "";

	customers
	.filter(c =>
	c.customerName.toLowerCase().includes(search)
	)
	.forEach(c => {

		html += `
			<div onclick="selectCustomer(${c.id}, '${c.customerName}')"
			     style="padding:8px;cursor:pointer;">
			     ${c.customerName}
			</div>
			`;

	});

	dropdown.innerHTML = html;

	dropdown.style.display =
	html ? "block" : "none";
	}
function selectCustomer(id, name){

    document.getElementById("customerSearch").value = name;

    document.getElementById("customerId").value = id;

    document.getElementById("customerDropdown").style.display = "none";
}function loadMedicines(){
	let options = "";

	medicines.forEach(m => {
	    options += `
	    <option value="${m.medicineName}">
	    `;
	});

	fetch("/api/medicines")
	.then(res => res.json())
	.then(data => {

	    medicines = data;

	    let html = "";

	    data.forEach(m => {

	        html += `
	        <div onclick="selectMedicine('${m.medicineName}')"
	             style="padding:8px;cursor:pointer;">
	            ${m.medicineName}
	        </div>
	        `;
	    });

	    document.getElementById("medicineDropdown").innerHTML = html;

	});

}
function filterMedicines(event){
	 if(event &&
		      (event.key==="ArrowUp" ||
		       event.key==="ArrowDown" ||
		       event.key==="Enter" ||
		       event.key==="Escape")){
		        return;
		    }
	let search =
	document.getElementById("medicineSearch")
	.value.toLowerCase();

	let dropdown =
	document.getElementById("medicineDropdown");

	let html = "";

	medicines
	.filter(m =>
	m.medicineName.toLowerCase().includes(search)
	)
	.forEach(m => {

		html += `
			<div onclick="selectMedicine('${m.medicineName}')"
			     style="padding:8px;cursor:pointer;
			            display:flex;
			            justify-content:space-between;
			            align-items:center;">

			    <span>${m.medicineName}</span>

			    <span style="
			        font-size:12px;
			        color:white;
			        background:${m.scheduleType === 'OTC' ? '#28a745' : '#dc3545'};
			        padding:2px 8px;
			        border-radius:12px;">
			        ${m.scheduleType}
			    </span>

			</div>
			`;

	});

	dropdown.innerHTML = html;

	dropdown.style.display =
	html ? "block" : "none";

	}
function selectMedicine(name){
	

	document.getElementById("medicineSearch").value =
	name;

	document.getElementById("medicineDropdown").style.display =
	"none";
	// Schedule
	 

	}
function addMedicine(){
	let medicineName =
		document.getElementById("medicineSearch").value;

		let medicine =
		medicines.find(
		m => m.medicineName === medicineName
		);

		if(!medicine){
		    alert("Select valid medicine");
		    return;
		}

		
let qty =
	parseInt(document.getElementById("quantity").value);

	
document.getElementById("stockInfo").innerText =
	medicine.quantity || 0;
	document.getElementById("mrpInfo").innerText =
	medicine.mrp || 0;

	document.getElementById("purchasePriceInfo").innerText =
	medicine.purchasePrice || 0;

	document.getElementById("marginInfo").innerText =
	medicine.marginPercent || 0;

	document.getElementById("contentsInfo").innerText =
	medicine.contents || "-";

	document.getElementById("symptomsInfo").innerText =
	medicine.symptoms || "-";
	
//STOCK CHECK

if(medicine.quantity <= 0){

    alert("❌ Out Of Stock");

    return;
}

// EXPIRY CHECK
let today = new Date();

let expiryDate =
new Date(medicine.expiryDate);

if(expiryDate < today){

alert(
"❌ Medicine Expired. Billing Not Allowed"
);

return;
}
let amount =
medicine.mrp * qty;
if(qty > medicine.quantity){

    alert(
    "❌ Available Stock : " +
    medicine.quantity
    );

    return;
}

billItems.push({

medicineId: medicine.id,
medicineName: medicine.medicineName,
scheduleType: medicine.scheduleType,
batchNo: medicine.batchNo,

quantity: qty,
unit: medicine.unit,
unitPrice: medicine.mrp,
gst: medicine.gstPercent,   // Add this line
amount: amount


});

renderTable();
calculateTotal();
}

function renderTable(){

let html="";
let subtotal=0;

billItems.forEach((item,index)=>{

subtotal += item.amount;

html += `
<tr>

<td>${index+1}</td>

<td>${item.medicineName}</td>
<td>${item.scheduleType}</td>
<td>${item.batchNo}</td>
<td>${item.gst}%</td>



<td>
<input type="number"
value="${item.quantity}"
	oninput="calculateRow(this)">
</td>
<td>${item.unit}</td>

<td>
<input type="number"
value="${item.unitPrice}"
	oninput="calculateRow(this)">
</td>

<td class="amount">
${item.amount}
</td>
<td>
<button onclick="removeItem(${index})">
X
</button>
</td>

</tr>
`;

});

document.getElementById("billBody").innerHTML = html;

document.getElementById("subTotal").innerText = subtotal;

calculateTotal();

}

function removeItem(index){

billItems.splice(index,1);

renderTable();

}



function generateBill(){
	let customerId =
		document.getElementById("customerId").value;

let medicinesPayload=[];

billItems.forEach(item=>{

medicinesPayload.push({

medicineId:item.medicineId,
quantity:item.quantity

});

});

let billRequest = {

customerId: customerId || null,
customerName:
    document.getElementById("customerSearch").value,

doctorName:
document.getElementById("doctorName").value,

billType:
document.getElementById("billType").value,

discount:
parseFloat(
document.getElementById("discount").value || 0
),

paidAmount:
parseFloat(
document.getElementById("paidAmount").value || 0
),

medicines: medicinesPayload

};

fetch("/api/bills",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(billRequest)

})

.then(res=>res.json())

.then(data=>{
	document.getElementById("invoiceNo").value = data.invoiceNo;

	let discountPercent =
		parseFloat(document.getElementById("discount").value) || 0;

		let subTotal = data.subTotal;

		let discountAmount =
		(subTotal * discountPercent) / 100;

		let netAmount =
		subTotal - discountAmount;

		let billContent = `
			<p><b>Invoice :</b> ${document.getElementById("invoiceNo").value}</p>

		<p><b>Bill No :</b> ${data.id}</p>

		<p><b>Date :</b> ${data.billDate.substring(0,10)}</p>

		<p><b>Customer :</b> ${data.customer.customerName}</p>

		<p><b>Doctor :</b> ${data.doctorName}</p>

		<hr>

		<table>

		<tr>
		<th>Product</th>
		<th>Batch</th>
		<th>Qty</th>
		<th>Unit</th>
		<th>Rate</th>
		</tr>

		${billItems.map(item => `
		<tr>
		<td>${item.medicineName}</td>
		<td>${item.batchNo}</td>
		<td>${item.quantity}</td>
		<td>${item.unit}</td>
		<td>${item.unitPrice}</td>
		</tr>
		`).join("")}

		</table>

		<hr>

    let amount = qty * rate;

    row.cells[8].innerHTML = amount.toFixed(2);

    let index = row.rowIndex - 1;

function calculateTotal(){

    let subTotal = Number(
        document.getElementById("subTotal").innerText
    ) || 0;

    let discountPercent = Number(
        document.getElementById("discount").value
    ) || 0;

    let discountAmount =
        (subTotal * discountPercent) / 100;

    let netAmount =
        subTotal - discountAmount;

    document.getElementById("netTotal").value =
        netAmount.toFixed(2);

    // Cash / Credit Logic
    let billType =
        document.getElementById("billType").value;

    if(billType === "Cash"){

        document.getElementById("paidAmount").value =
            netAmount.toFixed(2);

    }else{

        document.getElementById("paidAmount").value = "0";

    }

}
function calculateBillTotal(){

    let subtotal = 0;

    billItems.forEach(item=>{
        subtotal += item.amount;
    });

    document.getElementById("subTotal").innerText = subtotal.toFixed(2);

    calculateTotal();
}

==========================================*/

const controls = [
   "invoiceNo",
   "billDate",
   "customerSearch",
   "billType",
   "medicineSearch",
   "quantity",
   "addItemBtn",
   "doctorName",
   "discount",
   "paidAmount",
   "printBtn"
];

function focusField(id){

   let el = document.getElementById(id);

   if(!el) return;

   el.focus();

   if(el.tagName==="INPUT"){
       el.select();
   }

}

function nextField(currentId){

   let index = controls.indexOf(currentId);

   if(index < controls.length-1){

       focusField(controls[index+1]);

   }

}

function previousField(currentId){

   let index = controls.indexOf(currentId);

   if(index>0){

       focusField(controls[index-1]);

   }

}


/*==============================
LEFT & RIGHT ARROW
==============================*/

document.addEventListener("keydown",function(e){

   let id=document.activeElement.id;

   if(e.key==="ArrowRight"){

       // dropdown open ho to navigation mat karo
       
       e.preventDefault();

       nextField(id);

   }

   if(e.key==="ArrowLeft"){

      
       e.preventDefault();

       previousField(id);

   }

});

Customer Keyboard
-------------------------*/
document.getElementById("customerSearch").addEventListener("keydown",function(e){

   let dropdown=document.getElementById("customerDropdown");

   let items=document.querySelectorAll("#customerDropdown div");

   // DOWN
   if(e.key==="ArrowDown"){

       if(items.length===0) return;

       e.preventDefault();

       customerIndex++;

       if(customerIndex>=items.length)
           customerIndex=0;

       items.forEach(x=>{
           x.style.background="";
           x.style.color="";
       });

       items[customerIndex].style.background="#0d6efd";
       items[customerIndex].style.color="white";
       items[customerIndex].scrollIntoView({
    	    behavior:"smooth",
    	    block:"nearest"
    	});

       return;
   }

   // UP
   if(e.key==="ArrowUp"){

       if(items.length===0) return;

       e.preventDefault();

       customerIndex--;

       if(customerIndex<0)
           customerIndex=items.length-1;

       items.forEach(x=>{
           x.style.background="";
           x.style.color="";
       });

       items[customerIndex].style.background="#0d6efd";
       items[customerIndex].style.color="white";
       items[customerIndex].scrollIntoView({
    	    behavior:"smooth",
    	    block:"nearest"
    	});

       return;
   }

   // ESC
   if(e.key==="Escape"){

       dropdown.style.display="none";
       customerIndex=-1;
       return;
   }

   // ENTER
   if(e.key==="Enter"){

       e.preventDefault();

       // Agar dropdown me item select hai
       if(items.length>0 && customerIndex>=0){

           items[customerIndex].click();

       }

       dropdown.style.display="none";

       customerIndex=-1;

       focusField("billType");

   }

});

let typeOpen = false;

const billType = document.getElementById("billType");

billType.addEventListener("keydown", function(e){

   // ENTER
   if(e.key === "Enter"){

       e.preventDefault();

       // First Enter -> open dropdown
       if(!typeOpen){

           typeOpen = true;

           // Edge/Chrome
           if(this.showPicker){
               this.showPicker();
           }else{
               this.click();
           }

           return;
       }

       // Second Enter -> confirm
       typeOpen = false;

       focusField("medicineSearch");

       return;
   }

   // ESC
   if(e.key === "Escape"){

       typeOpen = false;

       this.blur();

   }

   // UP & DOWN browser automatically handle karega
});
