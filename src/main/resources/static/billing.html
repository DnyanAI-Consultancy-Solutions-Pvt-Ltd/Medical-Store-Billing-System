
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medical Billing System</title>

<style>

body{
font-family:Arial;
background:#eef3f8;
margin:0;
}

.header{
background:#198754;
color:white;
padding:15px;
font-size:24px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
margin-bottom:20px;
}

.row{
display:flex;
gap:15px;
margin-bottom:10px;
flex-wrap:wrap;
}

input,select{
padding:8px;
width:220px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#198754;
color:white;
padding:10px;
}

td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.btn{
padding:10px 15px;
border:none;
background:#198754;
color:white;
cursor:pointer;
margin:5px;
}

.total-box{
text-align:right;
margin-top:20px;
}
@media print{

body *{
visibility:hidden;
}

#printArea,
#printArea *{
visibility:visible;
}

#printArea{
position:absolute;
left:0;
top:0;
width:100%;
}

.no-print{
display:none;
}

}

.receipt{
width:300px;
margin:auto;
font-family:monospace;
}

.receipt h2{
text-align:center;
}

.receipt hr{
border:1px dashed black;
}

</style>

</head>

<body>

<div class="header">
🏥 Medical Billing System
</div>

<div class="container">

<div class="card">

<h3>Invoice Details</h3>

<div class="row">

<input type="text"
id="invoiceNo"
placeholder="Invoice No">

<input type="date"
id="billDate">



</div>

<div class="row">

<select id="customerSelect">
</select>
<input type="text"
id="doctorName"
placeholder="Doctor Name">

<select id="billType">
<option value="Cash">Cash</option>
<option value="Credit">Credit</option>
</select>




</div>

</div>

<div class="card">

<h3>Add Medicines</h3>

<div class="row">

<select id="medicineSelect">
</select>

<input type="number"
id="quantity"
placeholder="Quantity">

<button class="btn"
onclick="addMedicine()">
Add Item
</button>

</div>

<table>

<thead>

<tr>
<th>Sr</th>
<th>Medicine</th>
<th>Qty</th>
<th>Rate</th>
<th>Amount</th>
<th>Action</th>
</tr>

</thead>

<tbody id="billBody">

</tbody>

</table>

<div class="total-box">

<p>
Sub Total :
₹ <span id="subTotal">0</span>
</p>

<p>
GST (18%) :
₹ <span id="gst">0</span>
</p>

<p>
Discount :
₹ <input type="number"
id="discount"
value="0"
onkeyup="calculateTotal()"
style="width:100px;">
</p>

<p>
Paid Amount :
₹ <input type="number"
id="paidAmount"
value="0"
style="width:100px;">
</p>

<h2>
Net Amount :
₹ <span id="netTotal">0</span>
</h2>

</div>

<button class="btn"
onclick="generateBill()">
Generate Bill
</button>



</div>
<div class="card">
<h3>Generated Bill</h3>

<div id="printArea">

<div class="receipt">

<h2> MEDICAL STORE</h2>

<p style="text-align:center">
GSTIN : 27ABCDE1234F1Z5
</p>

<hr>

<div id="billResult">
No Bill Generated
</div>

</div>

</div>

</div>
</div>

<script>

let medicines = [];
let billItems = [];

loadCustomers();
loadMedicines();

function loadCustomers(){

fetch("/api/customers")
.then(res=>res.json())
.then(data=>{

let html="";

data.forEach(c=>{

html += `
<option value="${c.id}">
${c.customerName}
</option>
`;

});

document.getElementById("customerSelect").innerHTML = html;

});

}

function loadMedicines(){

fetch("/api/medicines")
.then(res=>res.json())
.then(data=>{

medicines = data;

let html="";

data.forEach(m=>{

html += `
<option value="${m.id}">
${m.medicineName}
</option>
`;

});

document.getElementById("medicineSelect").innerHTML = html;

});

}

function addMedicine(){

let medicineId =
document.getElementById("medicineSelect").value;

let qty =
parseInt(document.getElementById("quantity").value);

let medicine =
medicines.find(m=>m.id==medicineId);

let amount =
medicine.price * qty;

billItems.push({

medicineId: medicine.id,
medicineName: medicine.medicineName,
quantity: qty,
price: medicine.price,
amount: amount

});

renderTable();

}

function renderTable(){

let html="";
let subtotal=0;

billItems.forEach((item,index)=>{

subtotal += item.amount;

html += `
<tr>

<td>${index+1}</td>

<td>${item.medicineName}</td>

<td>${item.quantity}</td>

<td>${item.price}</td>

<td>${item.amount}</td>

<td>
<button onclick="removeItem(${index})">
X
</button>
</td>

</tr>
`;

});

document.getElementById("billBody").innerHTML = html;

document.getElementById("subTotal").innerText = subtotal;

calculateTotal();

}

function removeItem(index){

billItems.splice(index,1);

renderTable();

}

function calculateTotal(){

let subtotal =
parseFloat(document.getElementById("subTotal").innerText);

let gst = subtotal * 0.18;

let discount =
parseFloat(document.getElementById("discount").value || 0);

let net = subtotal + gst - discount;

document.getElementById("gst").innerText =
gst.toFixed(2);

document.getElementById("netTotal").innerText =
net.toFixed(2);

}

function generateBill(){
	let customerId =
		document.getElementById("customerSelect").value;

let medicinesPayload=[];

billItems.forEach(item=>{

medicinesPayload.push({

medicineId:item.medicineId,
quantity:item.quantity

});

});

let billRequest = {

customerId: customerId,

doctorName:
document.getElementById("doctorName").value,

billType:
document.getElementById("billType").value,

discount:
parseFloat(
document.getElementById("discount").value || 0
),

paidAmount:
parseFloat(
document.getElementById("paidAmount").value || 0
),

medicines: medicinesPayload

};

fetch("/api/bills",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(billRequest)

})

.then(res=>res.json())

.then(data=>{

	document.getElementById("billResult").innerHTML = `

		<p><b>Invoice :</b> ${data.invoiceNo}</p>

		<p><b>Bill No :</b> ${data.id}</p>

		<p><b>Date :</b>
		${data.billDate.substring(0,10)}</p>

		<p><b>Customer :</b>
		${data.customer.customerName}</p>

		<p><b>Doctor :</b>
		${data.doctorName}</p>

		<hr>

		<table style="width:100%;font-size:12px">

		<tr>
		<td><b>Medicine</b></td>
		<td><b>Qty</b></td>
		<td><b>Rate</b></td>
		</tr>

		${billItems.map(item => `
		<tr>
		<td>${item.medicineName}</td>
		<td>${item.quantity}</td>
		<td>${item.price}</td>
		</tr>
		`).join("")}

		</table>

		<hr>

		<p>Sub Total :
		₹ ${data.subTotal}</p>

		<p>GST :
		₹ ${data.gst}</p>

		<p>Discount :
		₹ ${data.discount}</p>

		<h3>Total :
		₹ ${data.totalAmount}</h3>

		<p>Paid :
		₹ ${data.paidAmount}</p>

		<p>Balance :
		₹ ${data.balanceAmount}</p>

		<hr>

		<p style="text-align:center">
		Thank You Visit Again
		</p>

		<button onclick="printBill()"
		class="btn">
		🖨 Print Bill
		</button>

		`;
});

}
function printBill(){

	let content =
	document.getElementById("billResult").innerHTML;

	let win = window.open("","","width=900,height=700");

	win.document.write(`
	<html>
	<head>
	<title>Medical Bill</title>

	<style>

	body{
	font-family:Arial;
	padding:20px;
	}

	h2{
	text-align:center;
	}

	</style>

	</head>

	<body>

	<h2>
	🏥 Medical Store Invoice
	</h2>

	${content}

	</body>
	</html>
	`);

	win.document.close();

	win.print();

	}
</script>

</body>
</html>
