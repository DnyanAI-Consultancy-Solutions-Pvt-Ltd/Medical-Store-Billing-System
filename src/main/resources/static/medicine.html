<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medicine Management</title>

<style>

body{
    font-family: Arial;
    background:#f4f6f9;
    margin:0;
}

.navbar{
    background:#2c3e50;
    color:white;
    padding:15px;
    font-size:22px;
}

.menu{
    background:white;
    padding:15px;
    text-align:center;
}

.menu a{
    text-decoration:none;
    margin:20px;
    font-weight:bold;
    color:#2c3e50;
}
.modal-content{
    overflow-y:auto;
}

.container{
padding:20px;
min-width:1100px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.form-grid div{
display:flex;
flex-direction:column;
}

.form-grid input,
.form-grid select,
.form-grid textarea{
width:100%;
}
.form-grid div{
display:flex;
flex-direction:column;
}

input,
select,
textarea{
width:100%;
padding:10px;
box-sizing:border-box;
}

textarea{
height:80px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
max-height:none;
overflow:visible;
}

@media(max-width:768px){
.form-grid{
grid-template-columns:1fr;
}
}
button{
    padding:10px 15px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#3498db;
    color:white;
}

</style>

</head>

<body>
<div class="navbar">
Medical Billing System
</div>

<div class="menu">

<a href="dashboard.html">Dashboard</a>

<a href="medicine.html">Medicine</a>

<a href="customer.html">Customer</a>

<a href="billing.html">Billing</a>

<a href="inventory.html">Inventory</a>

</div>

<div class="container">
<h2>Medicine Management</h2>
<input type="hidden" id="medicineId">
<div class="form-grid">
<h3>Add / Update Products</h3>
<br>
<div>
<label>Product Name</label>
<input type="text" id="medicineName" placeholder="Medicine Name">
<datalist id="medicineList"></datalist>
</div>
<div>
<label>Company Name</label>
<input type="text"
id="companyName"
placeholder="Company Name">
<datalist id="companyList"></datalist>
</div>
<div><label>Batch No</label>
<input type="text" id="batchNo">
</div>
<div>
<label>Unit</label>
<select id="unit">
    <option value="Tablet">Tablet</option>
    <option value="Capsule">Capsule</option>
    <option value="Strip">Strip</option>
    <option value="Bottle">Bottle</option>
    <option value="Tube">Tube</option>
    <option value="Vial">Vial</option>
    <option value="Injection">Injection</option>
    <option value="Sachet">Sachet</option>
    <option value="Pack">Pack</option>
    <option value="Piece">Piece</option>
</select>
</div>
<div>
<label>MRP</label>
<input type="number"
id="mrp"
placeholder="MRP">
</div>
<div><label>Purchase Price</label>
<input type="number" id="purchasePrice">
</div>
<div>
<label>Opening Stock</label>
<input type="number" id="openingStock">
</div>
<div><label>GST %</label>
<select id="gstPercent">
<option value="0">0%</option>
<option value="5">5%</option>
<option value="12">12%</option>
<option value="18">18%</option>
<option value="28">28%</option>
</select>
</div>
<div>
<label>Schedule Type</label>

<select id="scheduleType">
<option value="OTC">OTC</option>
<option value="Schedule H">Schedule H</option>
<option value="Schedule H1">Schedule H1</option>
<option value="Schedule X">Schedule X</option>
</select>
</div>
<div>
<label>Expiry Date</label>

<input type="date"
id="expiryDate">
</div>
<div>
<label>Margin %</label>
<input type="number" id="marginPercent">
</div>
<div>
<label>Contents</label>

<textarea id="contents"></textarea>
</div>
<div>
<label>Substitues / Uses</label>
<textarea id="symptoms"></textarea>

</div>
<button onclick="saveMedicine()">
Save Medicine
</button>
</div>
</div>
<div class="card" style="margin-top:20px;">

<h3>Medicine List</h3>

<table>

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Company</th>
<th>Batch</th>
<th>Unit</th>
<th>MRP</th>
<th>Purchase Price</th>
<th>GST</th>
<th>Schedule</th>
<th>Opening</th>
<th>Stock</th>
<th>Expiry</th>
<th>Margin %</th>
<th>Contents</th>
<th>Substitutes</th>

</tr>

</thead>

<tbody id="medicineTable">

</tbody>
</table>
</div>
<script>
loadMedicines();

function loadMedicines(){
	
	
fetch("/api/medicines")

.then(res=>res.json())

.then(data=>{

let rows="";

data.forEach(m=>{
	 
rows += `

<tr>

<td>${m.id}</td>

<td>${m.medicineName}</td>

<td>${m.companyName}</td>

<td>${m.batchNo}</td>
<td>${m.unit}</td>
<td>${m.mrp}</td>
<td>${m.purchasePrice}</td>
<td>${m.gstPercent}%</td>
<td>${m.scheduleType}</td>
<td>${m.openingStock}</td>
<td>${m.quantity}</td>
<td>${m.expiryDate}</td>
<td>${m.marginPercent || 0}</td>
<td>${m.contents || ''}</td>
<td>${m.symptoms || ''}</td>


<td>
<button onclick="editMedicine(${m.id})">
Edit
</button>

<button onclick="deleteMedicine(${m.id})">
Delete
</button>

</td>

</tr>

`;

});

document.getElementById("medicineTable").innerHTML
= rows;

});

}
function saveMedicine(){

	let id =
	document.getElementById("medicineId").value;

	let medicine = {

	medicineName:
	document.getElementById("medicineName").value,

	companyName:
	document.getElementById("companyName").value,

	batchNo:
		document.getElementById("batchNo").value,

		unit:
		document.getElementById("unit").value,

	mrp: parseFloat(
	document.getElementById("mrp").value),
	purchasePrice:
		parseFloat(
		document.getElementById("purchasePrice").value
		),

	openingStock:
		parseInt(
		document.getElementById("openingStock").value
		),

		quantity:
			parseInt(
			document.getElementById("openingStock").value
			),
	gstPercent:
		parseFloat(
		document.getElementById("gstPercent").value
		),
		scheduleType:
		document.getElementById("scheduleType").value,
	
		expiryDate:
	document.getElementById("expiryDate").value,
	marginPercent:
		document.getElementById("marginPercent").value,
	contents:
		document.getElementById("contents").value,

		symptoms:
		document.getElementById("symptoms").value

		
	};

	let url="/api/medicines";

	let method="POST";

	if(id){

	url="/api/medicines/"+id;

	method="PUT";

	}

	fetch(url,{

	method:method,

	headers:{
	"Content-Type":"application/json"
	},

	body:JSON.stringify(medicine)

	})
	.then(()=>{

	alert("Saved Successfully");

	loadMedicines();

	});

	}
	
function editMedicine(id){

	fetch("/api/medicines/"+id)

	.then(res=>res.json())

	.then(m=>{

	document.getElementById("medicineId").value =
	m.id;

	document.getElementById("medicineName").value =
	m.medicineName;

	document.getElementById("companyName").value =
	m.companyName;

	document.getElementById("mrp").value =
	m.mrp;
	document.getElementById("purchasePrice").value =
		m.purchasePrice;
	document.getElementById("openingStock").value =
	m.quantity;

	document.getElementById("expiryDate").value =
	m.expiryDate;
	document.getElementById("scheduleType").value =
m.scheduleType;
	document.getElementById("marginPercent").value =
		m.marginPercent || "";

		document.getElementById("contents").value =
		m.contents || "";

		document.getElementById("symptoms").value =
		m.symptoms || "";
	});

	}
function deleteMedicine(id){

	if(confirm("Delete Medicine ?")){

	fetch("/api/medicines/"+id,{

	method:"DELETE"

	})
	.then(()=>{

	loadMedicines();

	});

	}

}

</script>
</body>
</html>
